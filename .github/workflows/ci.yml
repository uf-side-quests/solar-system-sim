name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verification:
    name: Static, unit, build, and scientific verification
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run static and unit checks
        run: pnpm check
      - name: Build production application
        run: pnpm build
      - name: Verify REBOUND WebAssembly
        run: pnpm wasm:verify
      - name: Verify JPL regression bounds
        run: pnpm jpl:verify

  browser:
    name: Browser integration tests
    # The integration suite validates the real WebGPU rendering path. Linux
    # software adapters destroy long-running devices under this workload, while
    # GitHub's macOS runner provides the native GPU path used by the application.
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify system Chrome
        run: '"/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version'
      - name: Run browser integration tests
        run: pnpm test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    permissions: {}
    needs: [verification, browser]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] ||
             [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more CI checks failed"
            exit 1
          fi
          echo "All CI checks passed"
